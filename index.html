<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深海贪吃蛇 - 纯Canvas版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        /* 深海背景 */
        .ocean-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                #001a33 0%, 
                #003d66 20%, 
                #006699 40%, 
                #004d7a 60%, 
                #002a4d 80%, 
                #001122 100%);
            z-index: -2;
        }

        .bubbles {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
            border-radius: 50%;
            animation: rise 8s infinite ease-in;
            opacity: 0.6;
        }

        @keyframes rise {
            0% { bottom: -100px; transform: translateX(0) scale(1); opacity: 0.6; }
            50% { opacity: 0.3; }
            100% { bottom: 100vh; transform: translateX(100px) scale(0.5); opacity: 0; }
        }

        /* 游戏容器 */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-container {
            background: rgba(0, 20, 40, 0.9);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
        }

        .game-title {
            text-align: center;
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        /* 分数面板 */
        .score-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px;
            gap: 15px;
        }

        .score-item {
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
        }

        .score-value {
            color: #ff00ff;
            font-weight: bold;
            font-size: 18px;
        }

        /* Canvas */
        #gameCanvas {
            border: 2px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            background: rgba(0, 10, 20, 0.8);
            display: block;
        }

        /* 信息面板 */
        .info-panel {
            margin-top: 8px;
            padding: 8px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid #ff00ff;
            border-radius: 5px;
            color: #ff00ff;
            font-size: 11px;
            text-align: center;
        }

        .rainbow-hint {
            margin-top: 6px;
            padding: 6px 12px;
            background: linear-gradient(90deg, 
                rgba(255,0,0,0.2), rgba(255,165,0,0.2), rgba(255,255,0,0.2), 
                rgba(0,255,0,0.2), rgba(0,0,255,0.2), rgba(238,130,238,0.2));
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            color: #fff;
            font-size: 11px;
            text-align: center;
        }

        /* 移动端控制 */
        .mobile-controls {
            display: none;
            margin-top: 15px;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 5px;
        }

        .d-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #00ffff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .d-btn:active {
            background: rgba(0, 255, 255, 0.5);
            transform: scale(0.95);
        }

        .d-btn.up { grid-column: 2; }
        .d-btn.left { grid-column: 1; grid-row: 2; }
        .d-btn.down { grid-column: 2; grid-row: 2; }
        .d-btn.right { grid-column: 3; grid-row: 2; }

        .action-btn {
            width: 140px;
            height: 50px;
            background: rgba(255, 0, 255, 0.2);
            border: 2px solid #ff00ff;
            border-radius: 25px;
            color: #ff00ff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .action-btn:active {
            background: rgba(255, 0, 255, 0.5);
        }

        /* 游戏结束覆盖层 */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 20, 40, 0.95);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            display: none;
        }

        .overlay.active {
            display: block;
        }

        .overlay h2 {
            color: #ff00ff;
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ff00ff;
        }

        .overlay p {
            color: #00ffff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            color: #000;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .game-title { font-size: 20px; }
            .score-item { font-size: 12px; }
            .score-value { font-size: 16px; }
            .mobile-controls { display: flex; }
        }
    </style>
</head>
<body>
    <div class="ocean-bg"></div>
    <div class="bubbles" id="bubbles"></div>
    
    <div class="game-wrapper">
        <div class="game-container" style="position: relative;">
            <h1 class="game-title">🐍 深海贪吃蛇</h1>
            
            <div class="score-panel">
                <div class="score-item">
                    得分<br><span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    长度<br><span class="score-value" id="length">3</span>
                </div>
                <div class="score-item">
                    最高分<br><span class="score-value" id="highScore">0</span>
                </div>
            </div>
            
            <canvas id="gameCanvas"></canvas>
            
            <div class="info-panel">
                💎 金色道具 = 额外+3长度 + 🌈彩虹特效
            </div>
            
            <div class="rainbow-hint">
                🌈 吃到金色道具后蛇身变为彩虹色！
            </div>

            <!-- 游戏结束界面 -->
            <div class="overlay" id="gameOverScreen">
                <h2>GAME OVER</h2>
                <p>得分: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">重新开始</button>
            </div>
        </div>
        
        <!-- 移动端控制 -->
        <div class="mobile-controls" id="mobileControls">
            <div class="d-pad">
                <div class="d-btn up" data-dir="up">▲</div>
                <div class="d-btn left" data-dir="left">◀</div>
                <div class="d-btn down" data-dir="down">▼</div>
                <div class="d-btn right" data-dir="right">▶</div>
            </div>
            <div class="action-btn" id="pauseBtn">⏸️ 暂停</div>
        </div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
